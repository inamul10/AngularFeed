<div class="my-2">
  <div>
    <button class="btn btn-secondary">Total Available ({{this.feedBack.length}})</button>
  </div>
  <div class="my-2">
    <button (click)="addCategory()" class="btn btn-primary">Add Category</button>
  </div>
  <table class="table my-4">
    <thead>
      <tr>
      
        <th scope="col">SR NO</th>
        <th scope="col">Feedback Description</th>
        <th scope="col">Feedback Topics</th>
        <th scope="col">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of feedBack; let i = index">
        <th scope="row">{{ i + 1 }}</th>
        <td>{{ item.categoryDesc }}</td>
        <td>{{ item.categoryName }}</td>
        <td>Delete <i class="bi bi-trash3-fill"></i></td>
      </tr>
    </tbody>
  </table>
</div>
